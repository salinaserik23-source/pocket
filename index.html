<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<meta name="description" content="Log today's expenses. Data stays on this device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1A17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="design/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="design/icons/icon-192.png">
<style>
/* ==========================================================================
   Design tokens: Toasted Tangerine (from design/tokens.css + STYLE_GUIDE.md)
   ========================================================================== */
:root {
  color-scheme: light dark;
  --bg: #FBF6F0; --surface: #FFFDFA; --surface-2: #F3EBE2; --surface-3: #EADFD3; --border: #ECE2D7;
  --text: #2B211C; --text-2: #6B5B51; --text-3: #8A7A6F;
  --accent: #CF4A1F; --accent-pressed: #B23D17; --on-accent: #FFFFFF; --accent-soft: #FFE6D9; --accent-ink: #B5401B;
  /* Add/Save use --accent directly (v1.1, design/v2 notes row 2): white on #CF4A1F = 4.51:1, AA for normal text. */
  --danger: #D4392F; --on-danger: #FFFFFF; --danger-soft: #FDE3E0; --danger-ink: #B42318;
  --overlay: rgba(43, 33, 28, 0.38);
  --plus-bg: rgba(255, 255, 255, 0.22);

  /* Categories (the five categories, mapped onto the design's tints) */
  --cat-food-bg: #FFE6D6;          --cat-food-ink: #9A3D12;          --cat-food-bar: #F28B50;
  --cat-transport-bg: #FFF0C2;     --cat-transport-ink: #735400;     --cat-transport-bar: #E8B53A;
  --cat-bills-bg: #EAE5FB;         --cat-bills-ink: #4B3E9A;         --cat-bills-bar: #8B7BE0;
  --cat-entertainment-bg: #FFE0EC; --cat-entertainment-ink: #A3245A; --cat-entertainment-bar: #EC6FA0;
  --cat-other-bg: #EFE8DF;         --cat-other-ink: #5E5249;         --cat-other-bar: #B3A396;

  --shadow-1: 0 1px 2px rgba(80, 50, 30, 0.06), 0 2px 8px rgba(80, 50, 30, 0.06);
  --shadow-2: 0 1px 3px rgba(80, 50, 30, 0.08), 0 6px 18px rgba(80, 50, 30, 0.10);
  --shadow-accent: 0 8px 20px rgba(207, 74, 31, 0.30);
  --shadow-sheet: 0 -10px 36px rgba(60, 35, 20, 0.18);

  --font: "Nunito", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --emoji-font: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;
  --page-x: 20px;
  --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 24px; --r-sheet: 28px; --r-pill: 999px;
  --row-h: 64px; --key-h: 56px; --chip-h: 64px; --add-btn-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 120ms; --dur-sheet: 320ms;
  --max-w: 480px;

  /* v1.1 additions from design/v2/tokens-v2.css: streak + undo bar */
  --flame-top: #FFB25E; --flame-bottom: #CF4A1F; --flame-badge: var(--accent-soft); --flame-off: var(--text-3);
  --day-done: var(--accent); --on-day-done: var(--on-accent); --day-empty: var(--surface-2); --day-ring: var(--accent-soft);
  --streak-dot: 34px;
  --toast-bg: #2B211C; --toast-text: #F6EEE6; --toast-action: #FF9D74; --toast-h: 56px; --toast-gap: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1A17; --surface: #2A2420; --surface-2: #362F2A; --surface-3: #433A34; --border: #3A322C;
    --text: #F6EEE6; --text-2: #BCAEA3; --text-3: #8F8278;
    --accent: #FF8A5B; --accent-pressed: #F2733F; --on-accent: #2A1408; --accent-soft: #4A2A1C; --accent-ink: #FF9D74;
    --danger: #FF6B5E; --on-danger: #2A0D0B; --danger-soft: #4A221F; --danger-ink: #FF8A7F;
    --overlay: rgba(0, 0, 0, 0.55);
    --plus-bg: rgba(42, 20, 8, 0.14);
    --cat-food-bg: #4A2E22;          --cat-food-ink: #FFBE9A;          --cat-food-bar: #FF9F6B;
    --cat-transport-bg: #3D3418;     --cat-transport-ink: #F5D277;     --cat-transport-bar: #F2C54B;
    --cat-bills-bg: #332C55;         --cat-bills-ink: #C8BEFF;         --cat-bills-bar: #A193F0;
    --cat-entertainment-bg: #4A2336; --cat-entertainment-ink: #FFA9CC; --cat-entertainment-bar: #F584B3;
    --cat-other-bg: #3A332D;         --cat-other-ink: #D8CCC1;         --cat-other-bar: #BFB1A4;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.30);
    --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.35);
    --shadow-accent: 0 8px 24px rgba(255, 138, 91, 0.22);
    --shadow-sheet: 0 -10px 40px rgba(0, 0, 0, 0.5);
    --flame-top: #FFC27A; --flame-bottom: #FF8A5B;
    --toast-bg: #F6EEE6; --toast-text: #2B211C; --toast-action: #A33713;
  }
}
.cat-food          { --c-bg: var(--cat-food-bg);          --c-ink: var(--cat-food-ink);          --c-bar: var(--cat-food-bar); }
.cat-transport     { --c-bg: var(--cat-transport-bg);     --c-ink: var(--cat-transport-ink);     --c-bar: var(--cat-transport-bar); }
.cat-bills         { --c-bg: var(--cat-bills-bg);         --c-ink: var(--cat-bills-ink);         --c-bar: var(--cat-bills-bar); }
.cat-entertainment { --c-bg: var(--cat-entertainment-bg); --c-ink: var(--cat-entertainment-ink); --c-bar: var(--cat-entertainment-bar); }
.cat-other         { --c-bg: var(--cat-other-bg);         --c-ink: var(--cat-other-ink);         --c-bar: var(--cat-other-bar); }

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 17px; line-height: 22px; font-weight: 600;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.no-scroll { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
svg { display: block; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.emoji { font-family: var(--emoji-font); font-weight: 400; line-height: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ==========================================================================
   Page
   ========================================================================== */
.page {
  max-width: var(--max-w); margin: 0 auto;
  padding: calc(var(--safe-top) + var(--sp-4)) calc(var(--safe-right) + var(--page-x))
           calc(var(--safe-bottom) + 140px) calc(var(--safe-left) + var(--page-x));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: 44px; }
.greet { margin: 0; display: flex; align-items: center; color: var(--text-2); font-weight: 800; }
.top-r { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.brand { margin: 0; font-size: 15px; line-height: 20px; font-weight: 900; letter-spacing: 0.01em; color: var(--accent-ink); }
.test-badge { flex: none; padding: 3px 10px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-2);
  font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap; }
.hero { margin-top: var(--sp-2); }
.hero-label { margin: 0; font-size: 15px; line-height: 20px; font-weight: 800; color: var(--text-2); }
.total {
  margin: 2px 0 0; font-size: 56px; line-height: 60px; font-weight: 800; letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.total .cur { font-size: 36px; color: var(--text-2); vertical-align: 14px; margin-right: 2px; letter-spacing: 0; }
.total.is-zero { color: var(--text-2); }
.hero-sub { margin: 2px 0 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text-2); }

.section { margin-top: 28px; }

/* ---------- Streak card (v1.1 polish: design/v2/notes.md rows 8-12) ---------- */
.streak { position: relative; margin-top: var(--sp-5); padding: var(--sp-4); overflow: hidden; }
.streak > *:not(.confetti) { position: relative; z-index: 1; }
.streak-top { display: flex; align-items: center; gap: var(--sp-3); }
.flame-badge { width: 48px; height: 48px; flex: none; border-radius: 50%; background: var(--flame-badge); display: grid; place-items: center;
  transition: background-color 200ms, box-shadow 200ms; }
.flame { width: 38px; height: 38px; display: block; }
.flame .core { fill: #FFF4E6; opacity: .85; }
.streak.is-zero .flame-badge { background: var(--surface-2); }
.streak.is-zero .flame .body { fill: var(--flame-off); }
.streak.is-zero .flame .core { opacity: .5; }
.streak-count { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.streak-num { font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -0.01em; }
.streak-unit { font-size: 15px; line-height: 20px; font-weight: 700; color: var(--text-2); white-space: nowrap; }
.best { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--text-2); font-size: 13px; line-height: 18px; font-weight: 800; white-space: nowrap; }
.best b { color: var(--text); font-weight: 800; }
.best.new { background: var(--accent); color: var(--on-accent); }
.best.new b { color: var(--on-accent); }
.milestone-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: var(--sp-3); height: 28px; padding: 0 12px; border-radius: var(--r-pill);
  background: var(--surface); color: var(--accent-ink); font-size: 13px; line-height: 18px; font-weight: 900; box-shadow: var(--shadow-1); }
.milestone-tag svg { width: 16px; height: 16px; flex: none; }
.milestone-tag[hidden], .confetti[hidden] { display: none; }
.confetti { position: absolute; right: 8px; top: 44px; width: 160px; height: 70px; pointer-events: none; z-index: 0; opacity: .9; }
.streak-msg { margin: 10px 0 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text-2); }
.week { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day .wd { font-size: 12px; line-height: 16px; font-weight: 800; color: var(--text-2); }
.day .dot { width: var(--streak-dot); height: var(--streak-dot); border-radius: 50%; background: var(--day-empty); color: var(--on-day-done);
  display: grid; place-items: center; border: 2px solid transparent; }
.day .dot svg { opacity: 0; }
.day.done .dot { background: var(--day-done); }
.day.done .dot svg { opacity: 1; }
.day.today .wd { color: var(--accent-ink); }
.day.today.done .dot { box-shadow: 0 0 0 3px var(--day-ring); }
.day.today.pending .dot { background: transparent; border: 2px dashed var(--accent); }
/* Milestone state */
.streak.celebrate { background: linear-gradient(165deg, var(--accent-soft) 0%, var(--surface) 72%);
  box-shadow: 0 0 0 2px var(--accent), var(--shadow-accent); animation: glow 1.4s var(--ease-out) 2; }
.streak.celebrate .flame-badge { background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.streak.celebrate .flame { animation: flicker 0.7s var(--ease-out) 3; transform-origin: 50% 90%; }
.streak.celebrate .streak-msg { color: var(--text); font-weight: 800; font-size: 17px; line-height: 22px; }
.streak.celebrate .confetti { animation: pop 600ms var(--ease-out) both; }
@keyframes glow { 0% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 0 var(--accent-soft); } 60% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 12px var(--accent-soft); } 100% { box-shadow: 0 0 0 2px var(--accent), var(--shadow-accent); } }
@keyframes flicker { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15) rotate(-4deg); } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.9); } to { opacity: .9; transform: none; } }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); padding: 0 4px var(--sp-3); }
.section-h h2 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 800; }
.section-h h2 span { margin-left: 6px; font-size: 15px; font-weight: 600; color: var(--text-2); }
.section-h .meta { font-size: 15px; font-weight: 700; color: var(--text-2); white-space: nowrap; }

.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }

/* ---------- Rows ---------- */
.rows { list-style: none; margin: 0; padding: 0; }
.row { position: relative; height: var(--row-h); overflow: hidden; transition: height 200ms var(--ease-out), opacity 200ms; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; height: 1px; background: var(--border); z-index: 3; }
.row.removing { height: 0; opacity: 0; }
.row-bg { position: absolute; inset: 0; background: var(--danger); color: var(--on-danger); display: flex; justify-content: flex-end; }
.swipe-del { width: 96px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--on-danger); font-size: 14px; line-height: 18px; font-weight: 800; }
.fg {
  position: absolute; inset: 0; z-index: 1;
  display: flex; align-items: center; gap: 12px; padding: 0 4px 0 16px;
  background: var(--surface); touch-action: pan-y;
  transition: transform 220ms var(--ease-out), background-color 600ms;
}
.row.dragging .fg { transition: none; }
.row.open .fg { box-shadow: 6px 0 14px rgba(0, 0, 0, 0.10); }
.row.flash .fg { background: var(--accent-soft); transition: transform 220ms var(--ease-out), background-color 0ms; }
.tile { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--c-bg); display: grid; place-items: center; font-size: 22px; }
.txt { flex: 1; min-width: 0; }
.txt b, .txt small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txt b { font-size: 17px; line-height: 22px; font-weight: 700; }
.txt small { font-size: 14px; line-height: 18px; font-weight: 600; color: var(--text-2); }
.amt { flex: none; font-size: 17px; font-weight: 800; }
.del-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); }
.del-btn:hover { color: var(--danger-ink); }
.del-btn:active { background: var(--danger-soft); color: var(--danger-ink); }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding-top: 4px; margin-top: 22px; }
.art { position: relative; margin: 0 auto; width: 210px; height: 150px; }
.art .blob { position: absolute; left: 40px; top: 6px; width: 130px; height: 130px; background: var(--accent-soft);
  border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%; }
.art .purse { position: absolute; left: 58px; top: 24px; width: 94px; height: 94px; border-radius: 50%; background: var(--surface);
  box-shadow: var(--shadow-2); display: grid; place-items: center; font-size: 48px; }
.art .t { position: absolute; width: 42px; height: 42px; font-size: 21px; border-radius: 14px; background: var(--c-bg); display: grid; place-items: center; box-shadow: var(--shadow-1); }
.empty h3 { margin: 6px 0 0; font-size: 22px; line-height: 28px; font-weight: 800; }
.empty p { margin: 4px 0 0; font-size: 17px; line-height: 24px; font-weight: 600; color: var(--text-2); }
.empty p b { color: var(--accent-ink); font-weight: 900; }

/* ---------- Breakdown ---------- */
.insight { margin: 0 0 var(--sp-3); padding: 12px 16px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--text);
  font-size: 15px; line-height: 20px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.insight .emoji { font-size: 20px; }
.bars { list-style: none; margin: 0; padding: 6px 0; }
.bar-row { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 6px 16px; }
.bar-row .tile { width: 40px; height: 40px; border-radius: 12px; font-size: 20px; }
.bar-row.is-zero .bar-name, .bar-row.is-zero .bar-amt { color: var(--text-2); font-weight: 700; }   /* v1.1: colour, not opacity (AA) */
.bar-row.is-zero .tile { background: var(--surface-2); }
.bar-info { flex: 1; min-width: 0; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bar-name { font-size: 17px; line-height: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-name small { font-size: 13px; font-weight: 600; color: var(--text-2); }
.bar-amt { flex: none; font-size: 17px; font-weight: 800; }
.bar-bottom { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.track { flex: 1; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 5px; background: var(--c-bar); min-width: 8px; transition: width 300ms var(--ease-out); }
.track i.none { min-width: 0; width: 0 !important; }
.pct { flex: none; width: 38px; text-align: right; font-size: 13px; line-height: 18px; font-weight: 800; color: var(--text-2); }

/* ---------- Dock (Add button) ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 18px calc(var(--safe-right) + var(--page-x)) calc(var(--safe-bottom) + 16px) calc(var(--safe-left) + var(--page-x));
  background: linear-gradient(to bottom, transparent 0, var(--bg) 16px);
  display: flex; flex-direction: column; gap: var(--toast-gap);
}
body.toast-open .page { padding-bottom: calc(var(--safe-bottom) + 140px + var(--toast-h) + var(--toast-gap)); }   /* +68px */
.add-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; max-width: calc(var(--max-w) - 2 * var(--page-x)); height: var(--add-btn-h); margin: 0 auto;
  border-radius: var(--r-xl); background: var(--accent);   /* #CF4A1F + white = 4.51:1 (AA), per design/v2/notes.md row 2 */ color: var(--on-accent); box-shadow: var(--shadow-accent);
  font-size: 19px; line-height: 22px; font-weight: 800; letter-spacing: 0.005em;
  transition: transform var(--dur-fast), background-color var(--dur-fast);
}
.add-btn:active { background: var(--accent-pressed); transform: scale(0.97); }
.add-btn .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--plus-bg); display: grid; place-items: center; }

/* ---------- Sheet ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--overlay); opacity: 0; transition: opacity var(--dur-sheet) var(--ease-out); }
.overlay.open { opacity: 1; }
.overlay:not(.open) { pointer-events: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  max-width: var(--max-w); margin: 0 auto;
  max-height: calc(100dvh - var(--safe-top) - 24px); overflow-y: auto; overscroll-behavior: contain;
  padding: 20px calc(var(--safe-right) + var(--page-x)) calc(var(--safe-bottom) + 20px) calc(var(--safe-left) + var(--page-x));
  background: var(--bg); border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: var(--shadow-sheet);
  transform: translateY(105%); transition: transform var(--dur-sheet) var(--ease-out); outline: none;
}
.sheet.open { transform: none; }
.sheet.dragging { transition: none; }
.drag-zone { position: absolute; top: 0; left: 0; right: 0; height: 22px; touch-action: none; cursor: grab; }
.grabber { position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--text-3); opacity: .6; }
.sheet-h { position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px; touch-action: none; }
.sheet-h h2 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-size: 17px; font-weight: 800; pointer-events: none; }
.text-btn { position: relative; z-index: 1; min-width: 44px; height: 44px; display: inline-flex; align-items: center; color: var(--accent-ink); font-size: 17px; font-weight: 800; }

.amount { position: relative; display: block; text-align: center; padding: 12px 0 20px; min-height: 88px; }
.amount-hint { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; font-size: 13px; line-height: 18px; font-weight: 800;
  color: var(--accent-ink); opacity: 0; transition: opacity 160ms; pointer-events: none; }
.amount-hint.show { opacity: 1; }
.amount .val { font-size: 52px; line-height: 56px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.amount .val .cur { color: var(--text-2); font-weight: 700; margin-right: 2px; }
.amount.is-empty .val { color: var(--text-3); }
.amount.is-empty .val .cur { color: var(--text-3); }
.caret { display: inline-block; width: 3px; height: 44px; margin-left: 3px; border-radius: 2px; background: var(--accent); vertical-align: -4px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.note { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: var(--r-md); background: var(--surface-2); color: var(--text-2);
  border: 2px solid transparent; }
.note:focus-within { border-color: var(--accent); }
.note input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; font-size: 16px; font-weight: 700; color: var(--text); }
.note input::placeholder { color: var(--text-2); font-weight: 600; opacity: 1; }
.note-count { flex: none; font-size: 13px; line-height: 18px; font-weight: 800; color: var(--text-2); font-variant-numeric: tabular-nums; }
.note-count.at-limit { color: var(--accent-ink); }

.cat-h { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 13px; line-height: 18px; font-weight: 700; color: var(--text-2); }
.cat-h span:first-child { color: var(--text); }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
.chip {
  grid-column: span 2; position: relative; height: var(--chip-h); border-radius: var(--r-md); background: var(--surface-2);
  border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  transition: transform var(--dur-fast), background-color var(--dur-fast), border-color var(--dur-fast);
}
.chip:nth-child(n+4) { grid-column: span 3; }
.chip:active { transform: scale(0.97); }
.chip .emoji { font-size: 24px; }
.chip .lbl { font-size: 13px; line-height: 18px; font-weight: 800; color: var(--text-2); white-space: nowrap; }
.chip[aria-checked="true"] { background: var(--c-bg); border-color: var(--c-ink); }
.chip[aria-checked="true"] .lbl { color: var(--c-ink); }
.check { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--c-ink); color: var(--c-bg);
  display: none; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
.chip[aria-checked="true"] .check { display: grid; animation: pop 160ms var(--ease-out); }
@keyframes pop { from { transform: scale(0.6); } to { transform: scale(1); } }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.key { height: var(--key-h); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow-1); display: grid; place-items: center;
  font-size: 28px; line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums; transition: transform var(--dur-fast), background-color var(--dur-fast); }
.key.ghost { background: transparent; box-shadow: none; }
.key:active { background: var(--surface-3); transform: scale(0.97); }

.form-error { margin: 12px 0 0; text-align: center; font-size: 15px; line-height: 20px; font-weight: 700; color: var(--danger-ink); }
.save {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 58px; margin-top: 16px;
  border-radius: var(--r-lg); background: var(--accent);   /* #CF4A1F + white = 4.51:1 (AA), per design/v2/notes.md row 2 */ color: var(--on-accent); box-shadow: var(--shadow-accent);
  font-size: 18px; line-height: 22px; font-weight: 800; transition: transform var(--dur-fast), background-color var(--dur-fast), opacity var(--dur-fast);
}
.save:active { background: var(--accent-pressed); transform: scale(0.98); }
.save[aria-disabled="true"] { opacity: 0.4; box-shadow: none; }
.shake { animation: shake 320ms var(--ease-out); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* ---------- Undo bar (v1.1, design/v2 notes rows 3-6) ----------
   Lives INSIDE the dock (z 20), directly above the Add button, so it is always below the overlay (30) and the
   sheet (35) and can never cover the keypad. It is display:none while hidden (no pointer events at all) and
   while the sheet is open. */
.toast {
  position: relative; display: flex; align-items: center; gap: 8px;
  width: 100%; max-width: calc(var(--max-w) - 2 * var(--page-x)); height: var(--toast-h); margin: 0 auto; padding: 0 6px 0 18px;
  border-radius: 18px; background: var(--toast-bg); color: var(--toast-text); box-shadow: var(--shadow-2); overflow: hidden;
  font-size: 15px; line-height: 20px; font-weight: 700;
}
.toast:not(.open) { display: none; }
.toast.open { animation: toast-in 200ms var(--ease-out); }
.toast:not(.open), .toast:not(.open) * { pointer-events: none !important; }
body.sheet-open .toast { display: none; }   /* never show the bar while the sheet is up */
.toast.no-undo { padding-right: 18px; }
.toast .msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast .msg b { font-weight: 800; }
.toast .undo { flex: none; min-width: 76px; height: 44px; min-height: 44px; padding: 0 18px; border-radius: 12px; display: grid; place-items: center;
  color: var(--toast-action); font-size: 16px; line-height: 20px; font-weight: 900; background: color-mix(in srgb, var(--toast-action) 10%, transparent); }
.toast .undo:active { background: color-mix(in srgb, var(--toast-action) 22%, transparent); }
.toast .undo .secs { display: none; font-variant-numeric: tabular-nums; }
.toast .timer { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--toast-action); opacity: .7;
  border-radius: 0 2px 2px 0; transform-origin: 0 50%; }
.toast .timer.run { animation: countdown var(--toast-ms, 5000ms) linear forwards; }
.toast.no-undo .timer { display: none; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes countdown { from { width: 100%; } to { width: 0%; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  /* The countdown bar is decorative motion: hide it and show the seconds left as text on the Undo button instead. */
  .toast .timer { display: none; }
  .toast .undo .secs { display: inline; }
  .streak.celebrate .confetti { animation: none; }
}

<script>
/* Delete caches left by the archived v1 PWA ('expense-app-shell*' only; no other cache is touched),
   then register the offline service worker for this folder (scope './', never the origin root). */
(function () {
  try {
    if (location.protocol === 'file:') return;
    if (typeof caches !== 'undefined' && caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.filter(function (k) { return k.indexOf('expense-app-shell') === 0; }).forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
    if ('serviceWorker' in navigator && navigator.serviceWorker) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function (err) {
          console.info('[pocket] offline mode unavailable:', err && err.message);
        });
      });
    }
  } catch (_) {}
})();

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ */
  /* Config                                                              */
  /* ------------------------------------------------------------------ */
  var STORAGE_KEY = 'expense-app-today.v1';
  var CURRENCY = 'USD';
  var CATEGORIES = [
    { id: 'food',          label: 'Food',          emoji: '🍔' },
    { id: 'transport',     label: 'Transport',     emoji: '🚗' },
    { id: 'bills',         label: 'Bills',         emoji: '🧾' },
    { id: 'entertainment', label: 'Entertainment', emoji: '🎬' },
    { id: 'other',         label: 'Other',         emoji: '✨' }
  ];
  var CAT = {};
  CATEGORIES.forEach(function (c) { CAT[c.id] = c; });
  var MAX_INT_DIGITS = 7;
  var TOAST_MS = 5000;

  /* ------------------------------------------------------------------ */
  /* Helpers                                                             */
  /* ------------------------------------------------------------------ */
  var $ = function (id) { return document.getElementById(id); };
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: CURRENCY });
  var intFmt = new Intl.NumberFormat('en-US');
  function fmt(cents) { return money.format(cents / 100); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  /** Local calendar date (not UTC), YYYY-MM-DD. */
  /** Local calendar date built from getFullYear/getMonth/getDate (never the UTC ISO string). */
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function validISO(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var y = +s.slice(0, 4); return y >= 1970 && y <= 9999 && toISO(parseISO(s)) === s;
  }
  // Test hook: ?today=YYYY-MM-DD overrides "today" everywhere. Invalid values are ignored.
  var TODAY_OVERRIDE = (function () {
    try { var v = new URLSearchParams(location.search).get('today'); return validISO(v) ? v : null; } catch (_) { return null; }
  })();
  function todayISO() { return TODAY_OVERRIDE || toISO(new Date()); }
  function todayLabel() { return parseISO(todayISO()).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function uid() {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (_) {}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function sum(list) { return list.reduce(function (t, e) { return t + e.cents; }, 0); }
  function plural(n, word) { return intFmt.format(n) + ' ' + word + (n === 1 ? '' : 's'); }

  /* ------------------------------------------------------------------ */
  /* Storage: async window.storage when present, localStorage fallback    */
  /* ------------------------------------------------------------------ */
  var backend = 'memory';
  function hasArtifactStorage() {
    try { return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'); }
    catch (_) { return false; }
  }
  function unwrap(r) {
    if (r == null) return null;
    if (typeof r === 'string') return r;
    if (typeof r === 'object' && typeof r.value === 'string') return r.value;
    if (typeof r === 'object' && r.value == null && 'value' in r) return null;
    if (typeof r === 'object') { try { return JSON.stringify(r.value !== undefined ? r.value : r); } catch (_) { return null; } }
    return null;
  }
  function lsGet() { try { return window.localStorage.getItem(STORAGE_KEY); } catch (_) { return null; } }
  function lsSet(str) { try { window.localStorage.setItem(STORAGE_KEY, str); return true; } catch (_) { return false; } }

  async function readRaw() {
    if (hasArtifactStorage()) {
      try {
        var raw = unwrap(await window.storage.get(STORAGE_KEY));
        backend = 'window.storage';
        if (raw != null) return raw;
        var legacy = lsGet();           // e.g. data saved earlier via the fallback
        return legacy;
      } catch (err) {
        console.warn('[expenses] window.storage.get failed, using localStorage', err);
      }
    }
    backend = 'localStorage';
    return lsGet();
  }

  var writeChain = Promise.resolve(true);
  function persist() {
    var str = JSON.stringify({ version: 2, lastCategory: state.lastCategory, bestStreak: state.bestStreak,
      milestonesShown: state.milestonesShown, expenses: state.expenses });
    writeChain = writeChain.then(async function () {
      if (hasArtifactStorage() && backend !== 'localStorage') {
        try { await window.storage.set(STORAGE_KEY, str); backend = 'window.storage'; return true; }
        catch (err) { console.warn('[expenses] window.storage.set failed, using localStorage', err); backend = 'localStorage'; }
      }
      if (lsSet(str)) { backend = 'localStorage'; return true; }
      backend = 'memory';
      return false;
    }).then(function (ok) {
      document.documentElement.setAttribute('data-storage', backend);
      if (!ok) toast('Couldn’t save. Storage is unavailable.', null);
      return ok;
    });
    return writeChain;
  }

  function isValid(e) {
    return e && typeof e === 'object' && typeof e.id === 'string' && Number.isInteger(e.cents) && e.cents > 0 &&
      typeof e.cat === 'string' && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date);
  }
  /** What a save raised (bug C): { pb: best before the save, ms: milestones it fired }. Optional, per entry. */
  function cleanFx(fx) {
    if (!fx || typeof fx !== 'object' || !Number.isInteger(fx.pb) || fx.pb < 0 || !Array.isArray(fx.ms)) return undefined;
    return { pb: fx.pb, ms: fx.ms.filter(function (m) { return MILESTONES.indexOf(m) >= 0; }) };
  }
  async function load() {
    var raw = await readRaw();
    document.documentElement.setAttribute('data-storage', backend);
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      var list = Array.isArray(data) ? data : (data && Array.isArray(data.expenses) ? data.expenses : []);
      state.expenses = list.filter(isValid).map(function (e) {
        return { id: e.id, cents: e.cents, cat: CAT[e.cat] ? e.cat : 'other', note: typeof e.note === 'string' ? e.note : '',
          date: e.date, createdAt: Number(e.createdAt) || 0, fx: cleanFx(e.fx) };
      });
      state.lastCategory = data && CAT[data.lastCategory] ? data.lastCategory : null;
      // v1 -> v2 migration: streak fields may be missing.
      var best = data && Number.isInteger(data.bestStreak) && data.bestStreak > 0 ? data.bestStreak : 0;
      if (!data || data.bestStreak == null) best = Math.max(best, longestRun(todayISO()));
      state.bestStreak = best;
      state.milestonesShown = data && Array.isArray(data.milestonesShown)
        ? data.milestonesShown.filter(function (m) { return MILESTONES.indexOf(m) >= 0; }) : [];
      state.needsSave = !data || data.version !== 2;

      if (!reduce.matches) {   // follow the finger only when motion is OK
        sh.style.transform = 'translateY(' + d.dy + 'px)';
        ov.style.opacity = String(Math.max(0.2, 1 - d.dy / 400));
      }
    });
    function end(ev) {
      if (!d || (ev && ev.pointerId !== d.id)) return;
      var g = d; d = null;
      if (!g.active) return;
      suppress = true; setTimeout(function () { suppress = false; }, 60);
      var v = g.dy / Math.max(1, ev.timeStamp - g.t0);
      if (g.dy > 110 || (g.dy > 40 && v > 0.6)) { closeSheet(); return; }
      sh.classList.remove('dragging'); sh.style.transform = ''; ov.style.opacity = '';
    }
    sh.addEventListener('pointerup', end);
    sh.addEventListener('pointercancel', end);
    sh.addEventListener('click', function (ev) { if (suppress) { ev.preventDefault(); ev.stopPropagation(); } }, true);
  })();

  /* ------------------------------------------------------------------ */
  /* Swipe-to-delete (visible delete button is always there too)          */
  /* ------------------------------------------------------------------ */
  var OPEN_X = -96, drag = null, openRow = null, suppressClick = false;
  function setX(row, x) { row.querySelector('.fg').style.transform = x ? 'translateX(' + x + 'px)' : ''; }
  function closeOpenRow() { if (openRow) { setX(openRow, 0); openRow.classList.remove('open'); openRow = null; } }
  document.addEventListener('pointerdown', function (ev) {
    var fg = ev.target.closest('.fg');
    if (openRow && !ev.target.closest('.row.open')) closeOpenRow();
    if (!fg || ev.button > 0 || ev.target.closest('.del-btn')) return;
    var row = fg.parentNode;
    drag = { row: row, x0: ev.clientX, y0: ev.clientY, base: row === openRow ? OPEN_X : 0, x: 0, active: false, id: ev.pointerId };
  });
  document.addEventListener('pointermove', function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (!drag.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
      if (Math.abs(dx) < 8) return;
      drag.active = true; drag.row.classList.add('dragging');
      try { drag.row.querySelector('.fg').setPointerCapture(ev.pointerId); } catch (_) {}
    }
    drag.x = Math.min(0, drag.base + dx);
    setX(drag.row, drag.x);
  });
  function endDrag(ev) {
    if (!drag || (ev && ev.pointerId !== drag.id)) return;
    var d = drag; drag = null;
    if (!d.active) return;
    suppressClick = true; setTimeout(function () { suppressClick = false; }, 50);
    d.row.classList.remove('dragging');
    var w = d.row.offsetWidth;
    if (-d.x > w * 0.6) { removeExpense(d.row.getAttribute('data-id')); openRow = null; return; }
    if (-d.x > 48) { if (openRow && openRow !== d.row) closeOpenRow(); setX(d.row, OPEN_X); d.row.classList.add('open'); openRow = d.row; }
    else { setX(d.row, 0); d.row.classList.remove('open'); if (openRow === d.row) openRow = null; }
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  window.addEventListener('scroll', function () { if (!drag) closeOpenRow(); }, { passive: true });

  /* ------------------------------------------------------------------ */
  /* Events                                                               */
  /* ------------------------------------------------------------------ */
  document.addEventListener('click', function (ev) {
    if (suppressClick) { ev.preventDefault(); ev.stopPropagation(); return; }
    var del = ev.target.closest('[data-del]');
    if (del) { removeExpense(del.getAttribute('data-del')); return; }
    var key = ev.target.closest('[data-key]');
    if (key) { pressKey(key.getAttribute('data-key')); return; }
    var chip = ev.target.closest('[data-cat]');
    if (chip && chip.classList.contains('chip')) { selectCat(chip.getAttribute('data-cat')); return; }   // select only, never saves
  }, true);
  $('add-btn').addEventListener('click', openSheet);
  $('cancel').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', closeSheet);
  $('save').addEventListener('click', save);

  // Long-press backspace clears the amount.
  (function () {
    var t = null, back = document.querySelector('[data-key="back"]');
    back.addEventListener('pointerdown', function () { t = setTimeout(function () { t = null; pressKey('clear'); back.dataset.cleared = '1'; }, 550); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { back.addEventListener(n, function () { if (t) clearTimeout(t); t = null; }); });
    back.addEventListener('click', function (ev) { if (back.dataset.cleared) { delete back.dataset.cleared; ev.stopImmediatePropagation(); } }, true);
  })();

  document.addEventListener('keydown', function (ev) {
    if (!state.sheetOpen) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeSheet(); return; }
    var inField = document.activeElement && document.activeElement.tagName === 'INPUT';
    if (inField) { if (ev.key === 'Enter') { ev.preventDefault(); document.activeElement.blur(); } return; }
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^\d$/.test(ev.key) || ev.key === '.' || ev.key === ',') { ev.preventDefault(); pressKey(ev.key === ',' ? '.' : ev.key); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); pressKey('back'); }
    else if (ev.key.length === 1 && ev.key !== ' ') { ev.preventDefault(); hint(ev.key === '-' ? 'Amounts are always positive' : 'Numbers only'); }
    else if (ev.key === 'Enter' && !(ev.target.closest && ev.target.closest('button'))) { ev.preventDefault(); save(); }
  });

  // Roll over to a fresh "today" at midnight / when the app comes back to the foreground.
  var shownDay = todayISO();
  function checkDay() { if (todayISO() !== shownDay) { shownDay = todayISO(); if (syncStreak()) persist(); render(); } }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
  setInterval(checkDay, 60 * 1000);

  /* ------------------------------------------------------------------ */
  /* Boot                                                                 */
  /* ------------------------------------------------------------------ */
  renderChips();
  render();
  load().then(function () { if (syncStreak() || state.needsSave) persist(); render(); },
              function (err) { console.warn('[expenses] load failed', err); render(); })
    .then(function () { document.documentElement.setAttribute('data-ready', '1'); });
})();
</script>
</body>
</html>
